<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duniverse · 湩国地图集</title>
<style>
:root{
  color-scheme:light;
  --ink:#20343a;
  --muted:#667a80;
  --line:#dce6e7;
  --surface:rgba(255,255,255,.96);
  --accent:#246f6c;
  --accent-dark:#1e5d5b;
  --shadow:0 10px 28px rgba(27,53,58,.13),0 1px 3px rgba(27,53,58,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#dfe9eb;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,#mapCanvas:focus-visible{outline:3px solid #72aebc;outline-offset:3px}
header.mapHeader{position:fixed;z-index:30;inset:14px 14px auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px) minmax(0,1fr);align-items:start;gap:12px;pointer-events:none}
.mapHeader>*{pointer-events:auto}
.brandLockup,.mapActions,.regionSearch .searchField{border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.brandLockup{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%;min-height:54px;padding:8px 15px 8px 9px;border-radius:var(--radius)}
.brandMark{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:#244b50;color:#fff;font-size:16px;font-weight:750;letter-spacing:-.06em}
.brandText{display:grid;gap:2px;min-width:0}
.brandEyebrow{margin:0;color:#7a9094;font-size:9px;font-weight:700;letter-spacing:.16em;line-height:1.1;text-transform:uppercase}
h1{margin:0;color:var(--ink);font-size:15px;font-weight:650;letter-spacing:.01em;line-height:1.2;white-space:nowrap}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.regionSearch{position:relative;display:block;width:100%;margin:0}
.searchField{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:var(--radius);transition:border-color .16s,box-shadow .16s}
.regionSearch:focus-within .searchField{border-color:#a6c0c1;box-shadow:0 0 0 3px rgba(73,137,140,.12),var(--shadow)}
.searchIcon{flex:0 0 17px;width:17px;height:17px;color:#718489}
.searchField input{width:100%;min-width:0;padding:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}
.searchField input:focus-visible{outline:0}
.searchField input::placeholder{color:#7a8d91;opacity:1}
.searchPopup{position:absolute;z-index:45;top:calc(100% + 8px);left:0;width:100%;max-height:min(420px,calc(100dvh - 90px));overflow:auto;padding:6px;border:1px solid rgba(211,224,225,.98);border-radius:14px;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);animation:panel-in .14s ease-out}
.searchPopup[hidden]{display:none}
.searchOption{display:grid;gap:3px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background-color .14s}
.searchOption:hover,.searchOption[aria-selected="true"]{background:#edf4f3}
.searchOption:focus-visible{outline:2px solid #72aebc;outline-offset:-2px}
.searchOptionMain{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;font-size:13px;font-weight:620}
.searchOptionName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchOptionType{flex:0 0 auto;padding:2px 6px;border-radius:999px;background:#f0f5f4;color:#617a7d;font-size:10px;font-weight:550}
.searchOptionMeta{overflow:hidden;color:var(--muted);font-size:11px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
.searchStatus{margin:0;padding:9px 10px;color:var(--muted);font-size:12px;line-height:1.45}
.searchStatus[hidden]{display:none}
.mapActions{justify-self:end;display:flex;align-items:center;gap:4px;min-height:54px;padding:5px;border-radius:var(--radius)}
.mapButton{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;gap:7px;min-width:42px;height:42px;padding:0 11px;border:0;border-radius:10px;background:transparent;color:#34494f;font-size:13px;font-weight:560;line-height:1;white-space:nowrap;transition:background-color .16s,color .16s,transform .16s}
.mapButton:hover{background:#edf4f3;color:var(--accent-dark)}
.mapButton:active{transform:translateY(1px)}
.mapButton.zoom{min-width:40px;padding:0;font-size:22px;font-weight:450}
.mapButton.layers{color:var(--accent-dark)}
.mapButton.layers[aria-expanded="true"]{background:var(--accent-dark);color:#fff}
.mapButton.fit{background:var(--accent-dark);color:#fff}
.mapButton.fit:hover{background:#194f4d;color:#fff}
.buttonDivider{width:1px;height:24px;margin:0 3px;background:#e3eaea}
.compactLabel{display:none}
.layout{position:fixed;inset:0;min-height:100dvh;overflow:hidden}
#mapWrap{position:absolute;inset:0;overflow:hidden;background:#e8f0f2;padding:0}
#mapCanvas{display:block;width:100%;height:100%;border:0;background:#f5f8f9;box-shadow:none;touch-action:none;cursor:grab}
#mapCanvas.overRegion{cursor:pointer}
#mapCanvas.dragging{cursor:grabbing}
#mapSvg.mapSource{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;pointer-events:none;overflow:hidden}
#mapSvg.mapSource .region{fill:none!important}
aside{position:fixed;z-index:29;top:82px;right:14px;display:flex;flex-direction:column;gap:12px;width:min(360px,calc(100vw - 28px));max-height:calc(100dvh - 98px);overflow:auto;padding:16px;border:1px solid rgba(211,224,225,.96);border-radius:18px;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);animation:panel-in .16s ease-out}
aside[hidden]{display:none}
@keyframes panel-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.panelIntro{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:1px 2px 13px;border-bottom:1px solid #e8eeee}
.panelIntro h2{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
.panelIntro .muted{margin:5px 0 0}
.muted{color:var(--muted);font-size:12px;line-height:1.55}
.panelKicker{margin:0 0 5px;color:#789094;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.closePanel{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;padding:0;border:0;border-radius:9px;background:transparent;color:#65797e;font-size:21px;line-height:1}
.closePanel:hover{background:#edf3f3;color:#20343a}
.regionInfoLevels{display:grid;gap:8px}
.regionInfoLevel{padding:11px 12px;border:1px solid #e4ebeb;border-radius:11px;background:rgba(255,255,255,.76)}
.regionInfoLevelLabel{margin:0 0 4px;color:#71868a;font-size:10px;font-weight:650;letter-spacing:.04em}
.regionInfoLevelName{margin:0;color:var(--ink);font-size:14px;font-weight:650;line-height:1.4}
.regionInfoLevelTongue{margin:4px 0 0;color:#53817d;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.regionAreaCard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:11px;background:#edf5f3;color:#416b68;font-size:12px}
.regionAreaCard strong{color:#244b50;font-size:15px;font-weight:700;text-align:right}
.regionDescription{padding:11px 12px;border:1px solid #e4ebeb;border-radius:11px;background:#f8fafa}
.regionDescription h3{margin:0 0 6px;color:#71868a;font-size:11px;font-weight:650}
.regionDescription p{margin:0;color:#536a70;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.regionCoordinatePanel{display:grid;gap:8px;padding:11px 12px;border:1px solid #dce8e7;border-radius:11px;background:#f3f8f7}
.regionCoordinatePanel[hidden]{display:none}
.regionCoordinatePanel h3{margin:0;color:#526d70;font-size:11px;font-weight:700}
#regionInfoCoordinateContent{display:grid;gap:7px}
.regionCoordinateNote{margin:0;color:#71868a;font-size:10px;line-height:1.5}
.regionCoordinateRow{display:grid;gap:3px;padding:8px 9px;border-radius:9px;background:rgba(255,255,255,.8)}
.regionCoordinateRow strong{color:#36575c;font-size:11px;font-weight:700}
.regionCoordinateRow p{margin:0;color:#536a70;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.layerList{display:grid;gap:9px}
.layerGroup{display:grid;gap:5px}
.layerParent{display:flex;align-items:center;gap:7px;min-height:44px;padding:5px 8px;border:1px solid #e2eaea;border-radius:11px;background:#f7f9f9;font-size:13px}
.layerRow{display:flex;align-items:center;gap:10px;margin:0;padding:9px 10px;border:1px solid #e6ecec;border-radius:10px;background:rgba(255,255,255,.9);font-size:12.5px;cursor:pointer;transition:background-color .15s,border-color .15s}
.layerRow:hover{border-color:#cad8d8;background:#f7fafa}
.layerSwatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;background:var(--swatch)}
.layerName{flex:1}
.layerChildren{display:grid;gap:5px;margin-left:16px;padding-left:10px;border-left:1px solid #dfe8e8}
.layerChildren[hidden]{display:none}
.groupDisclosure{display:flex;align-items:center;justify-content:flex-start;gap:9px;flex:1 1 auto;width:auto;height:32px;min-width:0;padding:0 3px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left}
.groupDisclosure:hover{background:transparent}
.groupDisclosure .layerName{flex:1}
.treeChevron{width:7px;height:7px;border-right:1.5px solid #718489;border-bottom:1.5px solid #718489;transform:rotate(-45deg);transition:transform .16s}
.groupDisclosure[aria-expanded="true"] .treeChevron{transform:rotate(45deg)}
.layerParent input,.layerRow input{position:relative;width:36px;height:21px;margin:0;border:0;border-radius:999px;background:#d0dcdd;appearance:none;cursor:pointer;transition:background-color .16s,box-shadow .16s}
.layerParent input:checked,.layerRow input:checked{background:#287b75}
.layerParent input:indeterminate{background:#8baeb0}
.layerParent input:indeterminate:before{transform:translateX(10px)}
.layerParent input:before,.layerRow input:before{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,42,58,.18);transition:transform .16s}
.layerParent input:checked:before,.layerRow input:checked:before{transform:translateX(15px)}
.layerParent input:focus-visible,.layerRow input:focus-visible{outline:3px solid #72aebc;outline-offset:3px}
#mapHud{position:fixed;z-index:12;inset:auto auto 14px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;max-width:min(350px,calc(100vw - 28px));pointer-events:none}
#selected{max-width:100%;padding:10px 13px;border:1px solid rgba(216,229,230,.96);border-radius:12px;background:var(--surface);box-shadow:0 4px 16px rgba(27,53,58,.09);font-size:12.5px;line-height:1.55}
#selected[hidden]{display:none}
#selected b{color:var(--ink)}
.mapHint{margin:0;padding:7px 11px;border:1px solid rgba(216,229,230,.88);border-radius:999px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#526970;font-size:11px;line-height:1.35}
@media(max-width:760px){
  header.mapHeader{inset:8px 8px auto;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:46px 42px;gap:6px}
  .brandLockup{min-height:46px;gap:7px;padding:6px 9px}
  .brandMark{flex-basis:30px;width:30px;height:30px;border-radius:9px;font-size:14px}
  .brandEyebrow{display:none}
  h1{font-size:13px;letter-spacing:0}
  .mapActions{min-height:46px;gap:2px;padding:3px}
  .mapButton{min-width:36px;height:36px;padding:0 8px;border-radius:9px;font-size:12px}
  .mapButton.zoom{min-width:32px;padding:0;font-size:20px}
  .buttonDivider{height:21px;margin:0 1px}
  .compactLabel{display:inline}
  .wideLabel{display:none}
  .regionSearch{grid-column:1 / -1;grid-row:2;width:min(100%,360px)}
  .searchField{min-height:42px;padding:0 11px;border-radius:12px}
  .searchField input{font-size:12px}
  .searchPopup{max-height:calc(100dvh - 164px)}
  aside{top:106px;right:8px;width:min(360px,calc(100vw - 16px));max-height:calc(100dvh - 116px);padding:13px;border-radius:15px}
  #mapHud{left:8px;bottom:8px;max-width:calc(100vw - 16px)}
  #selected{padding:8px 10px;font-size:12px}
  .mapHint{padding:6px 9px;font-size:10px}
}
@media(max-width:380px){
  .brandMark{display:none}
  .brandLockup{padding:6px 8px}
  .brandLockup h1{font-size:12px}
  .mapButton.layers{min-width:34px;padding:0 6px}
  .mapButton.zoom{min-width:29px}
  .mapButton.fit{min-width:34px;padding:0 6px}
  .buttonDivider{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(prefers-reduced-transparency:reduce){.brandLockup,.mapActions,.regionSearch .searchField,.searchPopup,aside,#selected,.mapHint{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}}

function parseSubpaths(d){
  const tokens=d.match(/[MLZ]|[+-]?(?:\d*\.)?\d+(?:e[+-]?\d+)?/gi)||[];
  const subpaths=[];let points=null,command=null,index=0;
  while(index<tokens.length){
    const token=tokens[index];
    if(/^[a-z]$/i.test(token)){
      const operation=token.toUpperCase();index++;
      if(operation==='M'){
        if(points?.length)subpaths.push({points,closed:false});
        points=[];command='M';
      }else if(operation==='L')command='L';
      else if(operation==='Z'){
        if(points?.length)subpaths.push({points,closed:true});
        points=null;command=null;
      }
    }else if(points&&command){
      points.push({x:Number(token),y:Number(tokens[index+1])});index+=2;
      if(command==='M')command='L';
    }else index++;
  }
  if(points?.length)subpaths.push({points,closed:false});
  return subpaths;
}
function pointDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function segmentDistance(point,start,end){
  const dx=end.x-start.x,dy=end.y-start.y,lengthSquared=dx*dx+dy*dy;
  if(!lengthSquared)return pointDistance(point,start);
  const t=Math.max(0,Math.min(1,((point.x-start.x)*dx+(point.y-start.y)*dy)/lengthSquared));
  return pointDistance(point,{x:start.x+t*dx,y:start.y+t*dy});
}
function simplifyOpen(points,tolerance){
  if(points.length<=2)return points;
  const keep=new Uint8Array(points.length),stack=[[0,points.length-1]];
  keep[0]=1;keep[points.length-1]=1;
  while(stack.length){
    const [first,last]=stack.pop();let farthest=-1,maxDistance=tolerance;
    for(let i=first+1;i<last;i++){
      const distance=segmentDistance(points[i],points[first],points[last]);
      if(distance>maxDistance){maxDistance=distance;farthest=i;}
    }
    if(farthest>=0){keep[farthest]=1;stack.push([first,farthest],[farthest,last]);}
  }
  return points.filter((_,index)=>keep[index]);
}
function simplifyClosed(points,tolerance){
  if(points.length>1&&pointDistance(points[0],points.at(-1))<.01)points=points.slice(0,-1);
  if(points.length<4)return points;
  let pivot=1,maxDistance=0;
  for(let i=1;i<points.length;i++){
    const distance=pointDistance(points[0],points[i]);
    if(distance>maxDistance){maxDistance=distance;pivot=i;}
  }
  const first=simplifyOpen(points.slice(0,pivot+1),tolerance);
  const second=simplifyOpen([...points.slice(pivot),points[0]],tolerance);
  const result=[...first,...second.slice(1,-1)];
  return result.length>=3?result:points;
}
function toward(point,target,radius){
  const dx=target.x-point.x,dy=target.y-point.y,length=Math.hypot(dx,dy)||1;
  const step=Math.min(radius,length*.4)/length;
  return{x:point.x+dx*step,y:point.y+dy*step};
}
function pointText(point){return`${point.x.toFixed(2)},${point.y.toFixed(2)}`}
function makePathData(points,closed,radius){
  if(points.length<2)return'';
  if(closed&&points.length>1&&pointDistance(points[0],points.at(-1))<.01)points=points.slice(0,-1);
  if(points.length<2)return'';
  if(!radius||points.length<3){
    return`M ${pointText(points[0])} ${points.slice(1).map(point=>`L ${pointText(point)}`).join(' ')}${closed?' Z':''}`;
  }
  if(!closed){
    let d=`M ${pointText(points[0])}`;
    for(let i=1;i<points.length-1;i++){
      d+=` L ${pointText(toward(points[i],points[i-1],radius))} Q ${pointText(points[i])} ${pointText(toward(points[i],points[i+1],radius))}`;
    }
    return d+` L ${pointText(points.at(-1))}`;
  }
  const firstIn=toward(points[0],points[1],radius);let d=`M ${pointText(firstIn)}`;
  for(let i=1;i<points.length;i++){
    const point=points[i];
    d+=` L ${pointText(toward(point,points[(i+points.length-1)%points.length],radius))} Q ${pointText(point)} ${pointText(toward(point,points[(i+1)%points.length],radius))}`;
  }
  return d+` L ${pointText(toward(points[0],points.at(-1),radius))} Q ${pointText(points[0])} ${pointText(firstIn)} Z`;
}
function styleDash(value){
  if(!value||value==='none')return[];
  return value.match(/[\d.]+/g)?.map(Number).filter(Number.isFinite)||[];
}
function createRecord(element,drawGroup,layerId){
  const tag=element.tagName.toLowerCase(),style=getComputedStyle(element);
  const record={
    tag,drawGroup,layerId,fill:style.fill,stroke:style.stroke,
    lineWidth:parseFloat(style.strokeWidth)||0,
    lineCap:style.strokeLinecap||'butt',lineJoin:style.strokeLinejoin||'miter',
    dash:styleDash(style.strokeDasharray),
    fillOpacity:parseFloat(style.fillOpacity)||1,strokeOpacity:parseFloat(style.strokeOpacity)||1,
    bounds:element.getBBox()
  };
  if(tag==='path'){
    const raw=element.getAttribute('d')||'',subpaths=parseSubpaths(raw);
    const isRegion=element.classList.contains('region');
    const radius=isRegion||drawGroup==='nationalBorder'?1.8:
      drawGroup==='provinceBoundaries'||drawGroup==='majorRegionBoundaries'?1.1:
      layerId==='lakes'?2.6:
      HYDROLOGY_LAYER_IDS.has(layerId)?0.75:0;
    record.code=element.dataset.code||null;
    record.fill=isRegion?'none':record.fill;
    const tolerances=['oceanFill','islandFills'].includes(layerId)?COASTAL_FILL_LOD_TOLERANCES:
      HYDROLOGY_LAYER_IDS.has(layerId)?HYDROLOGY_LOD_TOLERANCES:LOD_TOLERANCES;
    record.variants=tolerances.map(tolerance=>{
      const data=subpaths.map(subpath=>{
        const reduced=subpath.closed?simplifyClosed(subpath.points.slice(),tolerance):simplifyOpen(subpath.points,tolerance);
        return makePathData(reduced,subpath.closed,radius);
      }).filter(Boolean).join(' ');
      return new Path2D(data);
    });
  }else if(tag==='circle'){
    record.cx=parseFloat(element.getAttribute('cx'))||0;
    record.cy=parseFloat(element.getAttribute('cy'))||0;
    record.radius=parseFloat(element.getAttribute('r'))||0;
  }else if(tag==='text'){
    record.x=parseFloat(element.getAttribute('x'))||0;
    record.y=parseFloat(element.getAttribute('y'))||0;
    record.text=element.textContent||'';
    record.pairText=element.dataset.pairText||'';
    record.language=element.dataset.language||'';
    record.letterSpacing=parseFloat(element.dataset.letterSpacing)||0;
    record.textBaseline=style.dominantBaseline==='central'?'middle':'alphabetic';
    record.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    record.textAlign=style.textAnchor==='middle'?'center':style.textAnchor==='end'?'right':'left';
    record.glyphCount=Array.from(record.text).length;
    record.baseFontSize=Number.parseFloat(record.font.match(/[\d.]+px/)?.[0])||21;
    if(layerId==='cityLabels'||layerId==='cityTongueLabels'){
      record.cityPointX=Number.parseFloat(element.dataset.cityPointX);
      record.cityPointY=Number.parseFloat(element.dataset.cityPointY);
    }
  }
  return record;
}
function collectRecords(container,drawGroup=null,layerId=null){
  for(const element of container.children){
    const tag=element.tagName.toLowerCase();
    if(tag==='g'){
      const nextGroup=element.id||drawGroup;
      const nextLayer=element.dataset.layer||element.id||layerId||'base';
      collectRecords(element,nextGroup,nextLayer);
    }else if(['path','circle','text'].includes(tag)){
      const group=drawGroup||element.id||'base';
      const layer=element.id==='oceanFill'?'oceanFill':layerId||group;
      records.push(createRecord(element,group,layer));
    }
  }
}
function buildRegionIndex(){
  regionRecords=records.filter(record=>record.tag==='path'&&record.layerId==='regions'&&record.code).reverse();
  for(const record of regionRecords){
    const bounds=record.bounds,previous=regionBounds.get(record.code);
    if(previous){
      const left=Math.min(previous.x,bounds.x),top=Math.min(previous.y,bounds.y);
      const right=Math.max(previous.x+previous.width,bounds.x+bounds.width);
      const bottom=Math.max(previous.y+previous.height,bounds.y+bounds.height);
      regionBounds.set(record.code,{x:left,y:top,width:right-left,height:bottom-top});
    }else regionBounds.set(record.code,{x:bounds.x,y:bounds.y,width:bounds.width,height:bounds.height});
  }
}

function bindCapitalLabelsToMarkers(){
  // Capital labels and their red map dots were digitized separately; match each label to one nearby dot.
  const capitalLabels=records.filter(record=>record.tag==='text'&&record.layerId==='provinceCapitalLabels');
  const capitalMarkers=records.filter(record=>record.tag==='circle'&&record.layerId==='redMarkers');
  const candidatePairs=[];
  for(let labelIndex=0;labelIndex<capitalLabels.length;labelIndex++){
    const label=capitalLabels[labelIndex],city=CITY_BY_NAME.get(label.text);
    if(!city)continue;
    for(let markerIndex=0;markerIndex<capitalMarkers.length;markerIndex++){
      const marker=capitalMarkers[markerIndex];
      candidatePairs.push({labelIndex,markerIndex,city,marker,distance:Math.hypot(label.x-marker.cx,label.y-marker.cy)});
    }
  }
  candidatePairs.sort((a,b)=>a.distance-b.distance||a.labelIndex-b.labelIndex||a.markerIndex-b.markerIndex);

  const usedLabels=new Set(),usedMarkers=new Set(),markerByCityId=new Map();
  for(const pair of candidatePairs){
    if(pair.distance>CAPITAL_MARKER_MATCH_MAX_DISTANCE||usedLabels.has(pair.labelIndex)||usedMarkers.has(pair.markerIndex))continue;
    usedLabels.add(pair.labelIndex);usedMarkers.add(pair.markerIndex);
    markerByCityId.set(pair.city.id,pair.marker);
  }
  const bindAnchor=(record,marker)=>{
    if(!marker)return;
    record.cityPointX=marker.cx;record.cityPointY=marker.cy;
    record.cityPointMarkerRadius=marker.radius;
  };
  for(const record of capitalLabels){
    const city=CITY_BY_NAME.get(record.text);
    bindAnchor(record,city&&markerByCityId.get(city.id));
  }
  for(const record of records.filter(item=>item.tag==='text'&&item.layerId==='provinceCapitalTongueLabels')){
    const pairedLabel=capitalLabels
      .map(label=>({label,distance:Math.hypot(label.x-record.x,label.y-record.y)}))
      .sort((a,b)=>a.distance-b.distance)[0];
    if(pairedLabel&&pairedLabel.distance<=1){
      const city=CITY_BY_NAME.get(pairedLabel.label.text);
      bindAnchor(record,city&&markerByCityId.get(city.id));
    }
  }

  const nationalMarker=records
    .filter(record=>record.tag==='circle'&&record.layerId==='nationalCapitalMarker')
    .sort((a,b)=>b.radius-a.radius)[0];
  for(const record of records.filter(item=>item.tag==='text'&&['nationalCapitalLabels','nationalCapitalTongueLabels'].includes(item.layerId))){

}

function hitTestRegion(point){

    if(point.x<bounds.x||point.x>bounds.x+bounds.width||point.y<bounds.y||point.y>bounds.y+bounds.height)continue;
    if(hitCtx.isPointInPath(record.variants[0],point.x,point.y))return record.code;

function cityEntryForLabel(record){
  if(record.layerId.startsWith('nationalCapital')){
    const capital=CITY_COORDINATE_DATA.cities.find(city=>city.role==='capital');
    return capital?CITY_BY_ID.get(capital.id):null;
  }
  let candidates=record.layerId.includes('Tongue')
    ?(CITY_BY_TONGUE_NAME.get(record.text)||[])
    :[CITY_BY_NAME.get(record.text)].filter(Boolean);
  if(!candidates.length&&record.layerId.includes('Tongue')){
    const chineseName=Object.keys(CITY_TONGUE_NAMES).find(name=>CITY_TONGUE_NAMES[name]===record.text);
    const entry=chineseName?CITY_BY_NAME.get(chineseName):null;
    if(entry)candidates=[entry];
  }
  if(candidates.length===1)return candidates[0];
  if(!candidates.length)return null;
  const x=Number.isFinite(record.cityPointX)?record.cityPointX:record.x;
  const y=Number.isFinite(record.cityPointY)?record.cityPointY:record.y;
  if(!Number.isFinite(x)||!Number.isFinite(y))return null;
  let closest=null,distance=Infinity;
  for(const city of candidates){
    const next=Math.hypot(city.pointX-x,city.pointY-y);
    if(next<distance){closest=city;distance=next;}
  }
  return distance<=24?closest:null;
}
function cityLabelHitTest(clientX,clientY){
  const metrics=canvasMetrics(),zoomWidth=viewZoomWidth();
  const left=metrics.rect.left+canvas.clientLeft+metrics.offsetX;
  const top=metrics.rect.top+canvas.clientTop+metrics.offsetY;
  const eligibleLayers=new Set(['cityLabels','cityTongueLabels','provinceCapitalLabels','provinceCapitalTongueLabels','nationalCapitalLabels','nationalCapitalTongueLabels']);
  for(let index=records.length-1;index>=0;index--){
    const record=records[index];
    if(record.tag!=='text'||!eligibleLayers.has(record.layerId)||layerVisibility.get(record.layerId)===false)continue;
    const isCityTongue=record.layerId==='cityTongueLabels';
    const isCityChinese=record.layerId==='cityLabels';
    const isCapitalTongue=record.layerId==='provinceCapitalTongueLabels'||record.layerId==='nationalCapitalTongueLabels';
    const isCapital=record.layerId==='provinceCapitalLabels'||record.layerId==='nationalCapitalLabels';
    if((isCityTongue||isCityChinese)&&zoomWidth>CITY_LABEL_DETAIL_LIMIT)continue;
    if((isCapitalTongue||isCapital)&&zoomWidth>CAPITAL_LABEL_DETAIL_LIMIT)continue;
    const city=cityEntryForLabel(record);if(!city)continue;
    let textX=record.x,textY=record.y;
    if((isCityTongue||isCityChinese||isCapitalTongue||isCapital)&&Number.isFinite(record.cityPointX)&&Number.isFinite(record.cityPointY)){
      const stablePoint=screenStableLabelPoint(record,metrics.scale);
      textX=stablePoint.x;textY=stablePoint.y;
    }
    if(isCityChinese&&layerVisibility.get('cityTongueLabels')!==false&&CITY_TONGUE_NAMES[record.text])textY-=FIXED_CITY_LABEL_LINE_OFFSET_PX/metrics.scale;
    else if(isCityTongue&&layerVisibility.get('cityLabels')!==false)textY+=FIXED_CITY_LABEL_LINE_OFFSET_PX/metrics.scale;
    if(record.layerId==='provinceCapitalLabels'&&layerVisibility.get('provinceCapitalTongueLabels')!==false)textY-=FIXED_CAPITAL_LABEL_LINE_OFFSET_PX/metrics.scale;
    else if(record.layerId==='provinceCapitalTongueLabels'&&layerVisibility.get('provinceCapitalLabels')!==false)textY+=FIXED_CAPITAL_LABEL_LINE_OFFSET_PX/metrics.scale;
    const fontSize=isCityTongue?FIXED_CITY_TONGUE_LABEL_FONT_PX:isCityChinese?FIXED_CITY_LABEL_FONT_PX:isCapitalTongue?FIXED_CAPITAL_TONGUE_LABEL_FONT_PX:FIXED_CAPITAL_LABEL_FONT_PX;
    textMetricsCtx.font=record.font.replace(/[\d.]+px/,`${fontSize}px`);
    const width=textMetricsCtx.measureText(record.text).width;
    const screenX=left+(textX-vb.x)*metrics.scale,screenY=top+(textY-vb.y)*metrics.scale;
    const boxLeft=screenX-(record.textAlign==='center'?width/2:record.textAlign==='right'?width:0)-4;
    const boxRight=boxLeft+width+8,halfHeight=Math.max(8,fontSize*.7);
    if(clientX>=boxLeft&&clientX<=boxRight&&clientY>=screenY-halfHeight&&clientY<=screenY+halfHeight)return city;
  }
  return null;
}

function normalizeSearchText(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().trim();

function regionSearchFields(entry){
  const own=[entry.name,entry.tongueName,entry.code||'',entry.postalCode||'',entry.id.split(':').slice(1).join(':')];
  const parent=entry.parentId?REGION_BY_ID.get(entry.parentId):null;
  const grandparent=parent?.parentId?REGION_BY_ID.get(parent.parentId):null;
  const parentFields=parent?[parent.name,parent.tongueName,parent.id.split(':').slice(1).join(':')]:[];
  const grandparentFields=grandparent?[grandparent.name,grandparent.tongueName,grandparent.id.split(':').slice(1).join(':')]:[];
  const ancestors=[...parentFields,...grandparentFields].map(normalizeSearchText).filter(Boolean);
  return {own:own.map(normalizeSearchText).filter(Boolean),ancestors};
}
function getRegionSearchResults(query){
  const needle=normalizeSearchText(query);
  if(!needle)return REGION_DIRECTORY.filter(entry=>entry.kind==='major');
  return REGION_SEARCH_DIRECTORY.map(entry=>{
    const fields=regionSearchFields(entry);
    let score=Infinity;
    if(fields.own.some(field=>field===needle))score=0;
    else if(fields.own.some(field=>field.startsWith(needle)))score=1;
    else if(fields.own.some(field=>field.includes(needle)))score=2;
    else if(fields.ancestors.some(field=>field.includes(needle)))score=3;
    return {entry,score};
  }).filter(result=>Number.isFinite(result.score))
    .sort((a,b)=>a.score-b.score||(({major:0,province:1,city:2}[a.entry.kind]??3)-({major:0,province:1,city:2}[b.entry.kind]??3))||a.entry.name.localeCompare(b.entry.name,'zh-CN'))

}

const mapPanel=document.getElementById('mapPanel'),panelToggle=document.getElementById('togglePanel'),regionInfoPanel=document.getElementById('regionInfoPanel');
function setMapPanelOpen(open){
  if(open){regionInfoPanel.hidden=true;closeRegionSearchPopup()}
  mapPanel.hidden=!open;panelToggle.setAttribute('aria-expanded',String(open));
  panelToggle.setAttribute('aria-label',open?'\u5173\u95ed\u56fe\u5c42\u9762\u677f':'\u6253\u5f00\u56fe\u5c42\u9762\u677f');
}
panelToggle.addEventListener('click',()=>setMapPanelOpen(mapPanel.hidden));
document.getElementById('closePanel').addEventListener('click',()=>{
  setMapPanelOpen(false);panelToggle.focus();
});
document.getElementById('closeRegionInfo').addEventListener('click',()=>{
  regionInfoPanel.hidden=true;regionSearchInput.focus();
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  if(!regionSearchPopup.hidden){closeRegionSearchPopup();event.preventDefault();}
  else if(!regionInfoPanel.hidden){regionInfoPanel.hidden=true;regionSearchInput.focus();event.preventDefault();}
  else if(!mapPanel.hidden){setMapPanelOpen(false);panelToggle.focus();event.preventDefault();}
});

window.addEventListener('resize',resizeCanvas);
resizeCanvas();
