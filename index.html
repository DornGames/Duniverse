<div class="panelIntro"><h2>地图图层</h2><p class="muted">远景自动收起文字与点标记；放大后显示细节。</p></div>
<div class="regionJump"><label for="regionJump">定位行政区</label><select id="regionJump" aria-label="定位行政区"><option value="">选择行政区</option></select></div>
<div class="layerList">
<label class="layerRow"><span class="layerSwatch" style="--swatch:#91b9c8"></span><span class="layerName">行政区边界</span><input type="checkbox" data-layer="regions" checked aria-label="显示行政区边界"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#313c43"></span><span class="layerName">海岸线</span><input type="checkbox" data-layer="coastline" checked aria-label="显示海岸线"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#665b56"></span><span class="layerName">邻国边界</span><input type="checkbox" data-layer="neighborBorders" checked aria-label="显示邻国边界"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#77a9da"></span><span class="layerName">河流</span><input type="checkbox" data-layer="rivers" checked aria-label="显示河流"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#82b8e9"></span><span class="layerName">跨境河流</span><input type="checkbox" data-layer="crossBorderRivers" checked aria-label="显示跨境河流"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#a5cde9"></span><span class="layerName">湖泊</span><input type="checkbox" data-layer="lakes" checked aria-label="显示湖泊"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#303a40"></span><span class="layerName">城市</span><input type="checkbox" data-layer="blackMarkers" checked aria-label="显示城市标记"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#e66a62"></span><span class="layerName">省会</span><input type="checkbox" data-layer="redMarkers" checked aria-label="显示省会标记"></label>
<label class="layerRow"><span class="layerSwatch" style="--swatch:#299a83"></span><span class="layerName">行政区代码</span><input type="checkbox" data-layer="labels" checked aria-label="显示行政区代码"></label>
</div>
<div id="selected" aria-live="polite"><b>尚未选择行政区</b><br>点击行政区可查看代码，并自动放大到该区域。</div>
<p class="muted">地图由 Canvas 绘制，坐标来自原图矢量提取，未进行地理配准。</p>
</aside></div>
<script>
const sourceSvg=document.getElementById('mapSvg');
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const hitCanvas=document.createElement('canvas');
const hitCtx=hitCanvas.getContext('2d');
const SOURCE_W=2048,MAP_W=2300,MAP_H=1448,DETAIL_LIMIT=1380,PAN_MARGIN=.12;
const LOD_TOLERANCES=[.5,1,2,4,8];
const DETAIL_LAYERS=new Set(['labels','blackMarkers','redMarkers']);
const DRAW_ORDER=new Map([
  ['oceanFill',0],['coastline',1],['regions',2],['lakes',3],['rivers',4],
  ['crossBorderRivers',5],['neighborBorders',6],['nationalBorder',7],
  ['blackMarkers',8],['redMarkers',9],['labels',10]
]);
let vb={x:0,y:0,w:MAP_W,h:MAP_H};
let drag=null,framePending=false,viewAnimation=null,hoveredCode=null,selectedCode=null,pixelRatio=1;
let records=[],regionRecords=[],regionBounds=new Map();
const layerInputs=[...document.querySelectorAll('input[data-layer]')];
const layerVisibility=new Map(layerInputs.map(input=>[input.dataset.layer,input.checked]));
const regionJump=document.getElementById('regionJump');

function parseSubpaths(d){
  const tokens=d.match(/[MLZ]|[+-]?(?:\d*\.)?\d+(?:e[+-]?\d+)?/gi)||[];
  const subpaths=[];let points=null,command=null,index=0;
  while(index<tokens.length){
    const token=tokens[index];
    if(/^[a-z]$/i.test(token)){
      const operation=token.toUpperCase();index++;
      if(operation==='M'){
        if(points?.length)subpaths.push({points,closed:false});
        points=[];command='M';
      }else if(operation==='L')command='L';
      else if(operation==='Z'){
        if(points?.length)subpaths.push({points,closed:true});
        points=null;command=null;
      }
    }else if(points&&command){
      points.push({x:Number(token),y:Number(tokens[index+1])});index+=2;
      if(command==='M')command='L';
    }else index++;
  }
  if(points?.length)subpaths.push({points,closed:false});
  return subpaths;
}
function pointDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function segmentDistance(point,start,end){
  const dx=end.x-start.x,dy=end.y-start.y,lengthSquared=dx*dx+dy*dy;
  if(!lengthSquared)return pointDistance(point,start);
  const t=Math.max(0,Math.min(1,((point.x-start.x)*dx+(point.y-start.y)*dy)/lengthSquared));
  return pointDistance(point,{x:start.x+t*dx,y:start.y+t*dy});
}
function simplifyOpen(points,tolerance){
  if(points.length<=2)return points;
  const keep=new Uint8Array(points.length),stack=[[0,points.length-1]];
  keep[0]=1;keep[points.length-1]=1;
  while(stack.length){
    const [first,last]=stack.pop();let farthest=-1,maxDistance=tolerance;
    for(let i=first+1;i<last;i++){
      const distance=segmentDistance(points[i],points[first],points[last]);
      if(distance>maxDistance){maxDistance=distance;farthest=i;}
    }
    if(farthest>=0){keep[farthest]=1;stack.push([first,farthest],[farthest,last]);}
  }
  return points.filter((_,index)=>keep[index]);
}
function simplifyClosed(points,tolerance){
  if(points.length>1&&pointDistance(points[0],points.at(-1))<.01)points=points.slice(0,-1);
  if(points.length<4)return points;
  let pivot=1,maxDistance=0;
  for(let i=1;i<points.length;i++){
    const distance=pointDistance(points[0],points[i]);
    if(distance>maxDistance){maxDistance=distance;pivot=i;}
  }
  const first=simplifyOpen(points.slice(0,pivot+1),tolerance);
  const second=simplifyOpen([...points.slice(pivot),points[0]],tolerance);
  const result=[...first,...second.slice(1,-1)];
  return result.length>=3?result:points;
}
function toward(point,target,radius){
  const dx=target.x-point.x,dy=target.y-point.y,length=Math.hypot(dx,dy)||1;
  const step=Math.min(radius,length*.4)/length;
  return{x:point.x+dx*step,y:point.y+dy*step};
}
function pointText(point){return`${point.x.toFixed(2)},${point.y.toFixed(2)}`}
function makePathData(points,closed,radius){
  if(points.length<2)return'';
  if(closed&&points.length>1&&pointDistance(points[0],points.at(-1))<.01)points=points.slice(0,-1);
  if(points.length<2)return'';
  if(!radius||points.length<3){
    return`M ${pointText(points[0])} ${points.slice(1).map(point=>`L ${pointText(point)}`).join(' ')}${closed?' Z':''}`;
  }
  if(!closed){
    let d=`M ${pointText(points[0])}`;
    for(let i=1;i<points.length-1;i++){
      d+=` L ${pointText(toward(points[i],points[i-1],radius))} Q ${pointText(points[i])} ${pointText(toward(points[i],points[i+1],radius))}`;
    }
    return d+` L ${pointText(points.at(-1))}`;
  }
  const firstIn=toward(points[0],points[1],radius);let d=`M ${pointText(firstIn)}`;
  for(let i=1;i<points.length;i++){
    const point=points[i];
    d+=` L ${pointText(toward(point,points[(i+points.length-1)%points.length],radius))} Q ${pointText(point)} ${pointText(toward(point,points[(i+1)%points.length],radius))}`;
  }
  return d+` L ${pointText(toward(points[0],points.at(-1),radius))} Q ${pointText(points[0])} ${pointText(firstIn)} Z`;
}
function styleDash(value){
  if(!value||value==='none')return[];
  return value.match(/[\d.]+/g)?.map(Number).filter(Number.isFinite)||[];
}
function createRecord(element,drawGroup,layerId){
  const tag=element.tagName.toLowerCase(),style=getComputedStyle(element);
  const record={
    tag,drawGroup,layerId,fill:style.fill,stroke:style.stroke,
    lineWidth:parseFloat(style.strokeWidth)||0,
    lineCap:style.strokeLinecap||'butt',lineJoin:style.strokeLinejoin||'miter',
    dash:styleDash(style.strokeDasharray),
    fillOpacity:parseFloat(style.fillOpacity)||1,strokeOpacity:parseFloat(style.strokeOpacity)||1,
    bounds:element.getBBox()
  };
  if(tag==='path'){
    const raw=element.getAttribute('d')||'',subpaths=parseSubpaths(raw);
    const isRegion=element.classList.contains('region');
    const radius=isRegion||drawGroup==='nationalBorder'?1.8:
      layerId==='lakes'?2.6:
      ['rivers','crossBorderRivers','coastline'].includes(layerId)?2:0;
    record.code=element.dataset.code||null;
    record.fill=isRegion?'none':record.fill;
    record.variants=LOD_TOLERANCES.map(tolerance=>{
      const data=subpaths.map(subpath=>{
        const reduced=subpath.closed?simplifyClosed(subpath.points.slice(),tolerance):simplifyOpen(subpath.points,tolerance);
        return makePathData(reduced,subpath.closed,radius);
      }).filter(Boolean).join(' ');
      return new Path2D(data);
    });
  }else if(tag==='circle'){
    record.cx=parseFloat(element.getAttribute('cx'))||0;
    record.cy=parseFloat(element.getAttribute('cy'))||0;
    record.radius=parseFloat(element.getAttribute('r'))||0;
  }else if(tag==='text'){
    record.x=parseFloat(element.getAttribute('x'))||0;
    record.y=parseFloat(element.getAttribute('y'))||0;
    record.text=element.textContent||'';
    record.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    record.textAlign=style.textAnchor==='middle'?'center':style.textAnchor==='end'?'right':'left';
  }
  return record;
}
function collectRecords(container,drawGroup=null,layerId=null){
  for(const element of container.children){
    const tag=element.tagName.toLowerCase();
    if(tag==='g'){
      const nextGroup=element.id||drawGroup;
      const nextLayer=element.dataset.layer||element.id||layerId||'base';
      collectRecords(element,nextGroup,nextLayer);
    }else if(['path','circle','text'].includes(tag)){
      const group=drawGroup||element.id||'base';
      const layer=element.id==='oceanFill'?'oceanFill':layerId||group;
      records.push(createRecord(element,group,layer));
    }
  }
}
function buildRegionIndex(){
  regionRecords=records.filter(record=>record.tag==='path'&&record.layerId==='regions'&&record.code).reverse();
  for(const record of regionRecords){
    const bounds=record.bounds,previous=regionBounds.get(record.code);
    if(previous){
      const left=Math.min(previous.x,bounds.x),top=Math.min(previous.y,bounds.y);
      const right=Math.max(previous.x+previous.width,bounds.x+bounds.width);
      const bottom=Math.max(previous.y+previous.height,bounds.y+bounds.height);
      regionBounds.set(record.code,{x:left,y:top,width:right-left,height:bottom-top});
    }else regionBounds.set(record.code,{x:bounds.x,y:bounds.y,width:bounds.width,height:bounds.height});
  }
  for(const code of [...regionBounds.keys()].sort()){
    const option=document.createElement('option');option.value=code;option.textContent=code;regionJump.append(option);
  }
}

// Build Canvas paths from the extracted geometry, then remove the source SVG from the page.
collectRecords(sourceSvg);
records.sort((a,b)=>(DRAW_ORDER.get(a.drawGroup)??50)-(DRAW_ORDER.get(b.drawGroup)??50));
buildRegionIndex();
sourceSvg.remove();

function clampView(){
  vb.w=Math.min(MAP_W,Math.max(150,vb.w));vb.h=vb.w*MAP_H/MAP_W;
  const mx=vb.w*PAN_MARGIN,my=vb.h*PAN_MARGIN;
  vb.x=Math.max(-mx,Math.min(MAP_W-vb.w+mx,vb.x));
  vb.y=Math.max(-my,Math.min(MAP_H-vb.h+my,vb.y));
}
function canvasMetrics(){
  const rect=canvas.getBoundingClientRect(),width=canvas.clientWidth,height=canvas.clientHeight;
  const scale=Math.min(width/vb.w,height/vb.h);
  return{rect,width,height,scale,offsetX:(width-vb.w*scale)/2,offsetY:(height-vb.h*scale)/2};
}
function canvasToMap(clientX,clientY){
  const m=canvasMetrics(),left=m.rect.left+canvas.clientLeft,top=m.rect.top+canvas.clientTop;
  return{x:vb.x+(clientX-left-m.offsetX)/m.scale,y:vb.y+(clientY-top-m.offsetY)/m.scale};
}
function activeToleranceIndex(scale){
  const target=.75/Math.max(scale,.001);
  const index=LOD_TOLERANCES.findIndex(tolerance=>tolerance>=target);
  return index<0?LOD_TOLERANCES.length-1:index;
}
function overlaps(bounds,view,margin=0){
  return bounds.x+bounds.width>=view.x-margin&&bounds.x<=view.x+view.width+margin&&
    bounds.y+bounds.height>=view.y-margin&&bounds.y<=view.y+view.height+margin;
}
function drawRecord(record,toleranceIndex){
  const selected=record.code&&record.code===selectedCode;
  const hovered=record.code&&record.code===hoveredCode;
  ctx.save();ctx.globalAlpha=1;ctx.lineWidth=record.lineWidth;
  ctx.lineCap=record.lineCap;ctx.lineJoin=record.lineJoin;ctx.setLineDash(record.dash);
  if(record.tag==='path'){
    const path=record.variants[toleranceIndex];
    if(record.fill!=='none'&&record.fill!=='transparent'){
      ctx.globalAlpha=record.fillOpacity;ctx.fillStyle=record.fill;ctx.fill(path);
    }
    if(record.stroke!=='none'&&record.lineWidth>0){
      ctx.globalAlpha=record.strokeOpacity;
      ctx.strokeStyle=selected?'#e46936':hovered?'#172b3a':record.stroke;
      if(selected){ctx.lineWidth=1.8;ctx.setLineDash([])}
      else if(hovered){ctx.lineWidth=1.4;ctx.setLineDash([])}
      ctx.stroke(path);
    }
  }else if(record.tag==='circle'){
    ctx.beginPath();ctx.arc(record.cx,record.cy,record.radius,0,Math.PI*2);
    if(record.fill!=='none'){ctx.fillStyle=record.fill;ctx.globalAlpha=record.fillOpacity;ctx.fill()}
    if(record.stroke!=='none'&&record.lineWidth>0){ctx.strokeStyle=record.stroke;ctx.globalAlpha=record.strokeOpacity;ctx.stroke()}
  }else if(record.tag==='text'){
    ctx.font=record.font;ctx.textAlign=record.textAlign;ctx.textBaseline='alphabetic';
    if(record.stroke!=='none'&&record.lineWidth>0){ctx.strokeStyle=record.stroke;ctx.globalAlpha=record.strokeOpacity;ctx.strokeText(record.text,record.x,record.y)}
    if(record.fill!=='none'){ctx.fillStyle=record.fill;ctx.globalAlpha=record.fillOpacity;ctx.fillText(record.text,record.x,record.y)}
  }
  ctx.restore();
}
function draw(){
  const m=canvasMetrics();if(!m.width||!m.height)return;
  ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  ctx.clearRect(0,0,m.width,m.height);
  ctx.fillStyle='#f5f8f9';ctx.fillRect(0,0,m.width,m.height);
  const scale=m.scale,offsetX=m.offsetX,offsetY=m.offsetY;
  ctx.fillStyle='#fff';ctx.fillRect(offsetX-vb.x*scale,offsetY-vb.y*scale,SOURCE_W*scale,MAP_H*scale);
  ctx.fillStyle='#b1d0ed';ctx.fillRect(offsetX+(SOURCE_W-vb.x)*scale,offsetY-vb.y*scale,(MAP_W-SOURCE_W)*scale,MAP_H*scale);
  ctx.setTransform(pixelRatio*scale,0,0,pixelRatio*scale,pixelRatio*(offsetX-vb.x*scale),pixelRatio*(offsetY-vb.y*scale));
  ctx.lineJoin='round';ctx.lineCap='round';
  const view={x:vb.x,y:vb.y,width:vb.w,height:vb.h},toleranceIndex=activeToleranceIndex(scale);
  const detailed=vb.w<=DETAIL_LIMIT;
  for(const record of records){
    if(layerVisibility.get(record.layerId)===false)continue;
    if(!detailed&&DETAIL_LAYERS.has(record.layerId))continue;
    if(!overlaps(record.bounds,view,record.lineWidth+LOD_TOLERANCES[toleranceIndex]))continue;
    if((record.layerId==='rivers'||record.layerId==='crossBorderRivers')&&
       Math.max(record.bounds.width,record.bounds.height)*scale<.7)continue;
    drawRecord(record,toleranceIndex);
  }
}
function apply(){clampView();draw()}
function queueApply(){
  if(framePending)return;
  framePending=true;requestAnimationFrame(()=>{framePending=false;apply()});
}
function stopViewAnimation(){
  if(viewAnimation!==null){cancelAnimationFrame(viewAnimation);viewAnimation=null;}
}
function animateView(target,duration=520){
  stopViewAnimation();
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){vb=target;apply();return;}
  const start={...vb};let startTime=null;
  function frame(now){
    if(startTime===null)startTime=now;
    const progress=Math.min(1,(now-startTime)/duration),eased=1-Math.pow(1-progress,3);
    vb={x:start.x+(target.x-start.x)*eased,y:start.y+(target.y-start.y)*eased,
      w:start.w+(target.w-start.w)*eased,h:start.h+(target.h-start.h)*eased};
    apply();
    if(progress<1)viewAnimation=requestAnimationFrame(frame);else viewAnimation=null;
  }
  viewAnimation=requestAnimationFrame(frame);
}
function zoom(factor,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2){
  stopViewAnimation();
  const width=Math.max(150,Math.min(MAP_W,vb.w*factor)),height=width*MAP_H/MAP_W;
  vb.x=cx-(cx-vb.x)*(width/vb.w);vb.y=cy-(cy-vb.y)*(height/vb.h);vb.w=width;vb.h=height;apply();
}
function zoomToRegion(code,animate=true){
  const bounds=regionBounds.get(code);if(!bounds)return;
  const aspect=MAP_W/MAP_H,padding=1.4;
  const width=Math.min(MAP_W,Math.max(bounds.width*padding,bounds.height*aspect*padding,180));
  const centerX=bounds.x+bounds.width/2,centerY=bounds.y+bounds.height/2;
  const target={x:centerX-width/2,y:centerY-width/aspect/2,w:width,h:width/aspect};
  if(animate)animateView(target);else{stopViewAnimation();vb=target;apply();}
}
function selectRegion(code,animate=true){
  if(!regionBounds.has(code))return;
  selectedCode=code;hoveredCode=null;regionJump.value=code;
  document.getElementById('selected').innerHTML=`<b>??????${code}</b><br>???????${records.filter(record=>record.layerId==='regions'&&record.code===code).length}<br><span class="muted">??????????????????????</span>`;
  zoomToRegion(code,animate);
}
function hitTestRegion(point){
  for(const record of regionRecords){
    const bounds=record.bounds;
    if(point.x<bounds.x||point.x>bounds.x+bounds.width||point.y<bounds.y||point.y>bounds.y+bounds.height)continue;
    if(hitCtx.isPointInPath(record.variants[0],point.x,point.y))return record.code;
  }
  return null;
}
function resizeCanvas(){
  const width=canvas.clientWidth,height=canvas.clientHeight;
  pixelRatio=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  const pixelWidth=Math.round(width*pixelRatio),pixelHeight=Math.round(height*pixelRatio);
  if(canvas.width!==pixelWidth)canvas.width=pixelWidth;
  if(canvas.height!==pixelHeight)canvas.height=pixelHeight;
  draw();
}

layerInputs.forEach(input=>input.addEventListener('change',()=>{
  layerVisibility.set(input.dataset.layer,input.checked);draw();
}));
regionJump.addEventListener('change',()=>{if(regionJump.value)selectRegion(regionJump.value,true)});
canvas.addEventListener('wheel',event=>{
  event.preventDefault();const point=canvasToMap(event.clientX,event.clientY);
  zoom(event.deltaY<0?.88:1.14,point.x,point.y);
},{passive:false});
canvas.addEventListener('pointerdown',event=>{
  if(event.button!==0)return;
  stopViewAnimation();
  drag={x:event.clientX,y:event.clientY,vx:vb.x,vy:vb.y,moved:false,code:hitTestRegion(canvasToMap(event.clientX,event.clientY))};
  canvas.classList.add('dragging');canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(drag){
    const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
    if(Math.hypot(dx,dy)>3)drag.moved=true;
    if(drag.moved){
      const m=canvasMetrics();vb.x=drag.vx-dx/m.scale;vb.y=drag.vy-dy/m.scale;queueApply();
    }
    return;
  }
  const next=hitTestRegion(canvasToMap(event.clientX,event.clientY));
  canvas.classList.toggle('overRegion',Boolean(next));
  if(next!==hoveredCode){hoveredCode=next;draw();}
});
function endDrag(event){
  if(!drag)return;
  const {moved,code}=drag;drag=null;canvas.classList.remove('dragging');
  if(event.type==='pointerup'&&!moved&&code)selectRegion(code,true);
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('lostpointercapture',endDrag);
canvas.addEventListener('pointerleave',()=>{if(!drag&&hoveredCode){hoveredCode=null;canvas.classList.remove('overRegion');draw()}});
canvas.addEventListener('keydown',event=>{
  const distance=vb.w*.08;
  if(event.key==='ArrowLeft'){vb.x-=distance;event.preventDefault();apply()}
  else if(event.key==='ArrowRight'){vb.x+=distance;event.preventDefault();apply()}
  else if(event.key==='ArrowUp'){vb.y-=distance;event.preventDefault();apply()}
  else if(event.key==='ArrowDown'){vb.y+=distance;event.preventDefault();apply()}
  else if(event.key==='+'||event.key==='='){zoom(.8);event.preventDefault()}
  else if(event.key==='-'||event.key==='_'){zoom(1.25);event.preventDefault()}
  else if(event.key==='Home'){stopViewAnimation();vb={x:0,y:0,w:MAP_W,h:MAP_H};apply();event.preventDefault()}
});
document.getElementById('zoomIn').onclick=()=>zoom(.8);
document.getElementById('zoomOut').onclick=()=>zoom(1.25);
document.getElementById('fit').onclick=()=>{stopViewAnimation();vb={x:0,y:0,w:MAP_W,h:MAP_H};apply()};
document.getElementById('reset').onclick=()=>{stopViewAnimation();vb={x:0,y:0,w:MAP_W,h:MAP_H};apply()};
const resizeObserver=new ResizeObserver(resizeCanvas);resizeObserver.observe(canvas);
window.addEventListener('resize',resizeCanvas);
resizeCanvas();
</script></body></html>
