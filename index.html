<h2>图层控制</h2>
<label><input type="checkbox" data-layer="regions" checked> 行政区填充与边界</label>
<label><input type="checkbox" data-layer="rivers" checked> 河流线段</label>
<label><input type="checkbox" data-layer="lakes" checked> 湖泊候选区域</label>
<label><input type="checkbox" data-layer="blackMarkers" checked> 黑色点状标记</label>
<label><input type="checkbox" data-layer="redMarkers" checked> 红色点状标记</label>
<label><input type="checkbox" data-layer="labels" checked> 行政区代码</label>
<div id="selected"><b>尚未选择行政区</b><br>点击地图上的任意行政区，可查看其代码和提取属性。</div>
<p class="muted">此预览由提取出的矢量路径生成，不显示原始位图作为底图。边界、河流、点标记和文字均为独立 SVG 对象。当前坐标是原图像素坐标，不是经纬度。</p>
</aside></div>
<script>
const svg=document.getElementById('mapSvg');let vb={x:0,y:0,w:2048,h:1448},drag=null;
function apply(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function zoom(f,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2){const nw=Math.max(150,Math.min(4096,vb.w*f)),nh=nw*1448/2048;vb.x=cx-(cx-vb.x)*(nw/vb.w);vb.y=cy-(cy-vb.y)*(nh/vb.h);vb.w=nw;vb.h=nh;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());zoom(e.deltaY<0?.85:1.18,q.x,q.y)},{passive:false});
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.classList.add('dragging');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x=drag.vx-(e.clientX-drag.x)*vb.w/r.width;vb.y=drag.vy-(e.clientY-drag.y)*vb.h/r.height;apply()});
function endDrag(){drag=null;svg.classList.remove('dragging')}svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
document.getElementById('zoomIn').onclick=()=>zoom(.8);document.getElementById('zoomOut').onclick=()=>zoom(1.25);
document.getElementById('fit').onclick=()=>{vb={x:0,y:0,w:2048,h:1448};apply()};document.getElementById('reset').onclick=()=>{vb={x:0,y:0,w:2048,h:1448};apply()};
document.querySelectorAll('input[data-layer]').forEach(el=>el.addEventListener('change',()=>{const g=document.getElementById(el.dataset.layer);if(g)g.style.display=el.checked?'':'none'}));
svg.querySelectorAll('path.region').forEach(path=>path.addEventListener('click',e=>{e.stopPropagation();const code=path.dataset.code;svg.querySelectorAll('path.region').forEach(p=>p.classList.toggle('selected',p.dataset.code===code));const parts=[...svg.querySelectorAll(`path.region[data-code="${code}"]`)];document.getElementById('selected').innerHTML=`<b>行政区代码：${code}</b><br>矢量面组件数：${parts.length}<br><span class="muted">几何来源：颜色分割与轮廓追踪；面积和边界仍需人工复核。</span>`}));
</script></body></html>
